<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classroom — Set your password</title>
<link rel="icon" type="image/png" href="img/favicon-32.png" />
<link rel="shortcut icon" href="favicon.ico" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
<meta name="theme-color" content="#bd0e0e" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="center-screen">
  <div class="card login-card">
    <div class="login-logo"><img src="img/logo.png" alt="Classroom logo" /></div>
    <h1 class="login-title">Set a new password</h1>
    <p class="sub">This is your first login — choose a password only you know.</p>
    <form id="cpForm">
      <label>New password</label>
      <input id="newPassword" type="password" minlength="6" required />
      <label>Confirm new password</label>
      <input id="confirmPassword" type="password" minlength="6" required />
      <button class="btn full" type="submit">Save & continue</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
  </div>
</div>
<script src="js/api.js"></script>
<script>
if (!Session.token) window.location.href = 'index.html';

document.getElementById('cpForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const errorMsg = document.getElementById('errorMsg');
  if (newPassword !== confirmPassword) {
    errorMsg.textContent = 'Passwords do not match';
    return;
  }
  try {
    await api('/auth/change-password', { method: 'POST', body: { newPassword } });
    window.location.href = `${Session.user.role}.html`;
  } catch (err) {
    errorMsg.textContent = err.message;
  }
});
</script>
</body>
</html>
